name: reclaim_app
description: "Private, non-judgemental support for reducing or stopping gambling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^17.5.0
  drift: ^2.35.3
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  dio: ^5.11.1
  intl: ^0.20.2
  uuid: ^4.6.0
  local_auth: ^3.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/blocklist-seed.txt

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: an encrypted SQLite build bundled on every native platform
      # (including the desktop host that runs `flutter test`), with no OpenSSL dependency.
      source: sqlite3mc
